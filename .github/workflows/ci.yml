name: ci

on:
  push:
    branches: [main, "cursor/**", "agent/**"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /tmp/newmmo-server .

  content-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Content tool tests (CT-001, CT-002)
        run: python3 -W error -m unittest discover -s tools/content/tests -v
      - name: Lint canon 01-13 (ERROR blocks publish)
        run: python3 tools/content/lint.py --out build/content
      - name: Export bundle (deterministic, blocked by lint errors)
        run: python3 tools/content/export.py --out build/content/export
      - name: Client data vs canon
        run: python3 tools/content/check_client_sync.py
      - name: Dungeon registry vs canon
        run: python3 tools/content/check_dungeon_registry.py
      - name: Zone definitions vs canon
        run: python3 tools/content/check_zone_defs.py
      - name: Docs path references
        run: python3 tools/content/check_docs_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-validation
          path: build/content/

  server-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: newmmo_ci
          POSTGRES_PASSWORD: newmmo_ci_admin
          POSTGRES_DB: newmmo_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U newmmo_ci -d newmmo_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # CI-only throwaway credentials for the service container above (no real secrets).
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGPASSWORD: newmmo_ci_admin
      POSTGRES_USER: newmmo_ci
      POSTGRES_DB: newmmo_ci
      NEWMMO_MIGRATOR_PASSWORD: ci_migrator_pw
      NEWMMO_PUBLISHER_PASSWORD: ci_publisher_pw
      NEWMMO_APP_PASSWORD: ci_app_pw
      NEWMMO_TEST_MIGRATE_DATABASE_URL: postgres://newmmo_migrator:ci_migrator_pw@127.0.0.1:5432/newmmo_ci?sslmode=disable
      NEWMMO_TEST_DATABASE_URL: postgres://newmmo_content_publisher:ci_publisher_pw@127.0.0.1:5432/newmmo_ci?sslmode=disable
      NEWMMO_TEST_APP_DATABASE_URL: postgres://newmmo_app:ci_app_pw@127.0.0.1:5432/newmmo_ci?sslmode=disable
      NEWMMO_CONTENT_EXPORT_DIR: ${{ github.workspace }}/build/content/export
      NEWMMO_REQUIRE_ROLE_URLS: "1"   # tests must fail (not fall back) when a role URL is missing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build export bundle
        run: python3 tools/content/export.py --out build/content/export
      - name: Install goose (pinned, see docs/contracts/toolchain-pins.md)
        run: |
          GOTOOLCHAIN=auto go install github.com/pressly/goose/v3/cmd/goose@v3.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create roles (once, as DB admin)
        run: bash deploy/newmmo/init/10-content-roles.sh
      - name: Migrations up -> reset -> up (single goose process, as newmmo_migrator)
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: ${{ env.NEWMMO_TEST_MIGRATE_DATABASE_URL }}
        run: |
          set -euo pipefail
          goose -dir server/migrations up
          goose -dir server/migrations reset
          goose -dir server/migrations up
          goose -dir server/migrations status
      - name: Two simultaneous goose runners must leave a consistent schema (T-010 R-11 / T-013 I-10)
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: ${{ env.NEWMMO_TEST_MIGRATE_DATABASE_URL }}
        run: |
          set +e   # GitHub runs steps with bash -e: one runner is EXPECTED to fail, do not abort on it
          set -o pipefail
          goose -dir server/migrations reset
          goose -dir server/migrations up > /tmp/goose-a.log 2>&1 & pa=$!
          goose -dir server/migrations up > /tmp/goose-b.log 2>&1 & pb=$!
          wait $pa; ra=$?
          wait $pb; rb=$?
          echo "runner A exit=$ra, runner B exit=$rb"; tail -n 5 /tmp/goose-a.log /tmp/goose-b.log
          if [ $ra -ne 0 ] && [ $rb -ne 0 ]; then echo "both runners failed"; exit 1; fi
          set -e
          goose -dir server/migrations up            # must be a clean no-op / completion
          n=$(psql "$NEWMMO_TEST_MIGRATE_DATABASE_URL" -Atc "select count(*) from goose_db_version where version_id > 0")
          echo "applied migrations: $n"
          want=$(ls server/migrations/*.sql | wc -l)
          [ "$n" = "$want" ]
          v=$(psql "$NEWMMO_TEST_MIGRATE_DATABASE_URL" -Atc "select count(distinct version_id) from goose_db_version where version_id > 0")
          [ "$v" = "$want" ]
      - name: Go vet + tests with database (no skips expected in content package)
        working-directory: server
        run: |
          set -euo pipefail
          go vet ./...
          go test ./internal/content -race -count=1 -v 2>&1 | tee /tmp/content-test.log
          if grep -E -- "--- SKIP" /tmp/content-test.log; then echo "database tests were skipped"; exit 1; fi
          go test ./... -race -count=1
          go mod verify
      - name: govulncheck (pinned official Go vulnerability scanner)
        working-directory: server
        run: |
          set -euo pipefail
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  lane-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Director tool tests
        run: python3 -W error -m unittest discover -s tools/director/tests -v
      - name: Lane gate (trailers + write lanes)
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main 2>/dev/null || true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BEFORE="$(git rev-parse "${{ github.sha }}~1")"
            fi
            RANGE="$BEFORE..${{ github.sha }}"
          else
            # agent/* branch: everything on the branch that is not on main (robust to force-pushes/rebases)
            BEFORE="$(git merge-base origin/main ${{ github.sha }} || true)"
            [ -n "$BEFORE" ] || { echo "no merge base with main; skip"; exit 0; }
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          echo "lane range: $RANGE"
          python3 tools/director/lane_check.py --range "$RANGE"

  client-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # SHA-512 from https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
      GODOT_ZIP_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Godot 4.7.2 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "$GODOT_ZIP_SHA512  godot.zip" | sha512sum -c -
          mkdir -p "$HOME/bin"
          unzip -q godot.zip -d godot_bin
          install -m 0755 godot_bin/Godot_v4.7.2-stable_linux.x86_64 "$HOME/bin/godot472"
          "$HOME/bin/godot472" --version
      - name: Strict Godot smokes (import, boot, STAGE1, MQ01, NET) + server tests
        run: ./tools/smoke_stage1.sh

  client-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required Stage 1 files
        run: |
          test -f client/project.godot
          test -f client/scenes/world/main.tscn
          test -f client/scenes/locations/dawn_valley.tscn
          test -f client/assets/LICENSES.md
          test -f docs/AUDIT.md
          test -f docs/IMPLEMENTATION_PLAN.md
