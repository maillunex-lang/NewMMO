name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /tmp/newmmo-server .

  content-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Content tool tests (CT-001, CT-002)
        run: python3 -W error -m unittest discover -s tools/content/tests -v
      - name: Lint canon 01-13 (ERROR blocks publish)
        run: python3 tools/content/lint.py --out build/content
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-validation
          path: build/content/

  client-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required Stage 1 files
        run: |
          test -f client/project.godot
          test -f client/scenes/world/main.tscn
          test -f client/scenes/locations/dawn_valley.tscn
          test -f client/assets/LICENSES.md
          test -f docs/AUDIT.md
          test -f docs/IMPLEMENTATION_PLAN.md
